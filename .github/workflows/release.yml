name: release

# Todo push em main vira uma release, sem passo manual (a mesma esteira do Vislo):
#   1. o CI roda;
#   2. a próxima versão sai dos commits semânticos desde a maior tag vX.Y.Z (feat → minor, resto → patch);
#   3. os binários de Windows, Linux e macOS (Intel e Apple Silicon) são construídos e o SHA256SUMS.txt é escrito;
#   4. `chore(release): vX.Y.Z` é commitado, tagueado e a release do GitHub é publicada com notas por tipo;
#   5. as cópias abertas do arbor veem a release e oferecem "Atualizar e reiniciar" (src/update).

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false # releases em ordem; um push novo espera o anterior

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/ci.yml

  plan:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags e histórico para planejar a versão
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        run: |
          node scripts/release.mjs plan > plan.json
          VERSION=$(node -p "require('./plan.json').version || ''")
          node -p "require('./plan.json').notes || ''" > notes.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Próxima versão: ${VERSION:-nenhuma}"
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  build:
    needs: plan
    if: needs.plan.outputs.version != ''
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, arch: x86_64 }
          - { name: Linux x64, os: ubuntu-22.04, arch: x86_64 } # glibc 2.35: roda em distros mais antigas
          - { name: Linux arm64, os: ubuntu-22.04-arm, arch: aarch64 }
          - { name: macOS Apple Silicon, os: macos-latest, arch: aarch64 }
          - { name: macOS Intel, os: macos-13, arch: x86_64 }
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versão
        run: node scripts/release.mjs stamp "$VERSION"
      - name: Build
        run: cargo build --release
      - name: Empacotar
        run: scripts/package.sh "$VERSION" "" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write # assina a proveniência do build
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Somas SHA-256
        run: |
          mkdir -p out
          find artifacts -path 'artifacts/dist-*' -type f -exec cp {} out/ \;
          (cd out && sha256sum -- * > SHA256SUMS.txt) # nomes puros: o updater compara exatamente (src/update/release.rs)
          cat out/SHA256SUMS.txt
      # Proveniência assinada (Sigstore): `gh attestation verify <arquivo> --repo juninmd/arbor`
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/arbor-*
      - name: Commit da versão, tag e release
        run: |
          V="$VERSION"
          node scripts/release.mjs stamp "$V"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): v${V} [skip ci]"
          TARGET="$GITHUB_SHA"
          git fetch origin main
          if git rebase origin/main && git tag -a "v${V}" -m "arbor v${V}" && git push --atomic origin HEAD:main "v${V}"; then
            TARGET="$(git rev-parse HEAD)"
          else
            echo "::warning::não deu para enviar o commit de versão para main (branch protegida?); a tag vai no commit construído"
            git rebase --abort 2>/dev/null || true
          fi
          gh release create "v${V}" out/* --target "$TARGET" --title "arbor v${V}" --notes-file artifacts/notes/notes.md
