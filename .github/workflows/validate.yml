name: Validate

on: [pull_request]

# Um push novo no mesmo PR cancela a run anterior, para a fila não acumular. Em main (e quando o
# release chama o ci) nada é cancelado: o evento entra no grupo para não colidir com o do release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    # Validação padrão dos repositórios (arquivos de segredo rastreados etc.).
    # As etapas de Node/Python são puladas: o build e os testes de Rust ficam no ci.yml.
    uses: juninmd/base-actions/.github/workflows/reusable-validate.yml@main
