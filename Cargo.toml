[workspace]
members = ["crates/arbor-core", "crates/arbor-bench"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/juninmd/arbor"

[package]
name = "arbor"
description = "Explorer de arquivos rápido, bonito e multiplataforma, que nunca trava."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "arbor"

[dependencies]
arbor-core = { path = "crates/arbor-core" }
mimalloc = { version = "0.1", default-features = false }
iced = { version = "0.14", features = ["tokio", "image", "svg", "advanced"] }
tokio = { version = "1", features = ["rt", "fs", "sync", "time"] }
vislo-core = { git = "https://github.com/juninmd/vislo" }
notify = "8"
open = "5"
# arquivos na área de transferência do sistema (CF_HDROP, NSPasteboard, text/uri-list)
arboard = { version = "3.7", default-features = false }
# Lixeira navegável (listar, restaurar, esvaziar); mesma versão que o arbor-core já usa
trash = "5"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
fast_image_resize = "6"
# atualização automática (src/update): HTTPS só para as releases deste repositório, SHA-256 conferido
ureq = "3"
serde_json = "1"
sha2 = "0.10"
self-replace = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
