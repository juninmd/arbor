[package]
name = "arbor-core"
description = "Núcleo do arbor: listagem paralela, ordenação natural, busca fuzzy e operações de arquivo."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
rayon = "1"
nucleo-matcher = "0.3"
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-channel = "0.3"
futures-core = "0.3"

[dev-dependencies]
tempfile = "3"
natord = "1"
