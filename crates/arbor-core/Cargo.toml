[package]
name = "arbor-core"
description = "Núcleo do arbor: listagem paralela, ordenação natural, busca fuzzy e operações de arquivo."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
rayon = "1"
nucleo-matcher = "0.3"
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-channel = "0.3"
futures-core = "0.3"
# compactados (src/archive.rs), todos em Rust puro
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
lzma-rs = "0.3"
sevenz-rust2 = "0.20"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_RestartManager"] }

[dev-dependencies]
tempfile = "3"
natord = "1"
