# Supply-chain gate, run in CI by cargo-deny: known vulnerabilities, licenses compatible with MIT,
# and dependencies only from crates.io or the vislo repository.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
yanked = "deny"
# Vulnerabilities fail everywhere in the tree; "unmaintained" only for crates we pick ourselves,
# since the transitive ones (paste, ttf-parser, zvariant...) come from iced and wgpu.
unmaintained = "workspace"
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono in arbor-core: no known vulnerability; replacing it is a separate change" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "IJG",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
# Duplicated versions come from iced/wgpu and are not ours to fix; listing them only adds noise.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/juninmd/vislo"]
