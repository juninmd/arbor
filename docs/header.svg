          <rect x="10" y="7" width="24" height="24" rx="7" fill="#8fe6ff" fill-opacity=".16"/>
          <path transform="translate(14 11) scale(.66)" d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z" fill="none" stroke="#8fe6ff" stroke-width="2"/>
          <text x="46" y="24" font-weight="700">Projetos</text>
          <text x="300" y="24" font-family="JetBrains Mono" font-size="11" fill="#dee4ff" fill-opacity=".45">pasta</text>
        </g>
        <g transform="translate(16 100)">
          <rect x="10" y="7" width="24" height="24" rx="7" fill="#ff94c9" fill-opacity=".16"/>
          <rect x="16" y="13" width="12" height="12" rx="2.5" fill="none" stroke="#ff94c9" stroke-width="1.6"/>
          <text x="46" y="24">aurora-lofoten.jpg</text>
          <text x="300" y="24" font-family="JetBrains Mono" font-size="11" fill="#dee4ff" fill-opacity=".45">8,0 MB</text>
        </g>
        <g transform="translate(16 144)">
          <rect x="10" y="7" width="24" height="24" rx="7" fill="#8ff0c0" fill-opacity=".16"/>
          <path transform="translate(14 11) scale(.66)" d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 5.5l-3 13" fill="none" stroke="#8ff0c0" stroke-width="2" stroke-linecap="round"/>
          <text x="46" y="24">main.rs</text>
          <text x="300" y="24" font-family="JetBrains Mono" font-size="11" fill="#dee4ff" fill-opacity=".45">1,2 KB</text>
        </g>
        <g transform="translate(16 188)">
          <rect x="10" y="7" width="24" height="24" rx="7" fill="#ffd08a" fill-opacity=".16"/>
          <circle cx="22" cy="22" r="4" fill="none" stroke="#ffd08a" stroke-width="1.6"/>
          <text x="46" y="24">trilha-foco.flac</text>
          <text x="300" y="24" font-family="JetBrains Mono" font-size="11" fill="#dee4ff" fill-opacity=".45">30 MB</text>
        </g>
        <g transform="translate(16 232)">
          <rect x="10" y="7" width="24" height="24" rx="7" fill="#b9a2ff" fill-opacity=".16"/>
          <rect x="17" y="12" width="10" height="14" rx="2" fill="none" stroke="#b9a2ff" stroke-width="1.6"/>
          <text x="46" y="24">relatorio-explorers.pdf</text>
          <text x="300" y="24" font-family="JetBrains Mono" font-size="11" fill="#dee4ff" fill-opacity=".45">1,3 MB</text>
        </g>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1279" height="419" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
